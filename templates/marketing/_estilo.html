{# Estilo compartilhado do módulo Marketing — só tokens do app.css, texto ≥ 11px, contraste ≥ 4.5:1, sem cor nova. #}
<style>
  .mkt-eyebrow{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.11em;color:var(--tinta-suave);font-weight:700;margin-bottom:5px}
  .mkt-tabs{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}
  .mkt-tab{padding:7px 15px;border-radius:99px;font-size:13px;color:var(--tinta-suave);text-decoration:none}
  .mkt-tab.on{background:var(--tinta);color:var(--superficie);font-weight:700}
  .mkt-sep{width:1px;height:22px;background:var(--fio)}
  .mkt-role{padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--tinta);color:var(--superficie)}
  .mkt-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:700;text-decoration:none;background:var(--superficie);border:1px solid var(--fio);color:var(--tinta)}
  .mkt-chip.on{background:var(--tinta);color:var(--superficie);border-color:var(--tinta)}
  .mkt-card{border-radius:var(--raio-g);background:var(--superficie);border:1px solid var(--fio);box-shadow:var(--sombra-cartao);overflow:hidden}
  .mkt-band-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--fio)}
  .mkt-band-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--superficie-2);border:1px solid var(--fio);text-decoration:none}
  .mkt-ico{width:18px;height:18px;flex:none}
  .mkt-col{flex:none;width:268px;background:var(--superficie-2);border:1px solid var(--fio);border-radius:var(--raio)}
  .mkt-col-h{padding:13px 15px 11px;border-bottom:1px solid var(--fio);position:sticky;top:0;background:var(--superficie-2);border-radius:var(--raio) var(--raio) 0 0}
  .mkt-cc{background:var(--superficie);border:1px solid var(--fio);border-radius:var(--raio);padding:12px;box-shadow:var(--sombra-1);cursor:grab}
  .mkt-tag{font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--superficie-2);color:var(--tinta-suave);border:1px solid var(--fio);border-radius:99px;padding:3px 8px}
  .mkt-av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--superficie-2);border:1px solid var(--fio);color:var(--tinta);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .mkt-meta{font-size:11px;color:var(--tinta-suave)}
  .mkt-bar{flex:1;height:5px;border-radius:99px;background:var(--fio);overflow:hidden}
  .mkt-bar>span{display:block;height:100%}
  .mkt-count{flex:none;font-size:11px;font-weight:700;color:var(--tinta-suave);background:var(--superficie-2);border:1px solid var(--fio);border-radius:99px;min-width:22px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
  .mkt-sec-h{padding:16px 20px;border-bottom:1px solid var(--fio)}
  .mkt-sec-h h2{margin:0;font-family:var(--fonte-titulo);font-size:16.5px;font-weight:600;color:var(--tinta)}
  .mkt-btn-ghost{width:32px;height:32px;flex:none;border-radius:var(--raio-p);border:1px solid var(--fio);background:var(--superficie);display:inline-flex;align-items:center;justify-content:center;color:var(--tinta-suave);cursor:pointer;text-decoration:none;font-size:16px}
  .mkt-nova{width:100%;height:36px;border-radius:11px;border:1px dashed var(--fio-forte);background:transparent;color:var(--tinta-suave);font-size:12.5px;font-weight:700;cursor:pointer}
  .mkt-nova:hover{border-color:var(--lampiao);color:var(--madeira)}
</style>
