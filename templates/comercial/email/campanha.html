<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ assunto }}</title></head>
<body style="margin:0; padding:0; background:#f4f1ea; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#2a251c;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea; padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 1px 3px rgba(40,34,20,.10);">
        <tr>
          <td style="background:#23201a; padding:22px 28px;">
            <span style="color:#e9dcc0; font-size:13px; letter-spacing:.14em; text-transform:uppercase;">Pousada Vô Testa</span>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 28px 8px;">
            {% for p in corpo_paragrafos %}
              <p style="margin:0 0 14px; font-size:15px; line-height:1.6; color:#2a251c;">{{ p|linebreaksbr }}</p>
            {% endfor %}
          </td>
        </tr>
        {% if url_whatsapp %}
        <tr>
          <td align="center" style="padding:8px 28px 6px;">
            <a href="{{ url_whatsapp }}" style="display:inline-block; background:#25d366; color:#ffffff; font-size:14px; font-weight:700; text-decoration:none; padding:12px 26px; border-radius:9px;">Falar no WhatsApp</a>
          </td>
        </tr>
        {% endif %}
        <tr>
          <td style="padding:20px 28px 26px; border-top:1px solid #f0ebe0;">
            <p style="margin:0 0 6px; font-size:12px; color:#a8a08c;">Pousada Vô Testa · Itá, Santa Catarina · a invenção que virou história.</p>
            <p style="margin:0; font-size:12px; color:#a8a08c;">Não quer mais receber estes e-mails? <a href="{{ descadastro_url }}" style="color:#8a8271; text-decoration:underline;">Descadastrar</a>.</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
