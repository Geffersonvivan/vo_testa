Ícone SVG por módulo para a sidebar. Recebe `codigo` (código do módulo).
No rail recolhido o ícone é o único identificador — por isso cada módulo tem o seu.
Uso: {% include "componentes/icone_modulo.html" with codigo=m.codigo %}
