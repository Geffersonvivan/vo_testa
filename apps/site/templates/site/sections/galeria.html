{% load static %}

<!-- GALERIA -->
<section class="fade-section py-16 sm:py-24 bg-madeira">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
        <div class="text-center mb-10 sm:mb-16">
            <p class="text-lampiao text-xs sm:text-sm tracking-[0.3em] uppercase mb-3 sm:mb-4">Galeria</p>
            <h2 class="font-display text-3xl sm:text-4xl md:text-5xl font-black text-pergaminho mb-4">Momentos no Tempo</h2>
        </div>

        <!-- Grade uniforme (consistência espacial): tiles idênticos, sem buracos.
             Destaque = realce por anel dourado, não por tamanho. -->
        <div id="galeria-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
            {% for foto in galeria %}
            <button type="button"
                    data-galeria-item
                    data-src="{% if foto.imagem %}{{ foto.imagem.url }}{% endif %}"
                    data-legenda="{{ foto.legenda|default:'' }}"
                    data-categoria="{{ foto.get_categoria_display }}"
                    class="aspect-square rounded-2xl overflow-hidden relative group cursor-pointer
                           bg-noturno/40 shadow-lg transition-all duration-300
                           hover:-translate-y-1 hover:shadow-2xl
                           focus:outline-none focus-visible:ring-2 focus-visible:ring-lampiao focus-visible:ring-offset-2 focus-visible:ring-offset-madeira
                           {% if foto.destaque %}ring-2 ring-lampiao/50{% endif %}">
                {% if foto.imagem %}
                <img src="{{ foto.imagem.url }}" alt="{{ foto.legenda }}" loading="lazy"
                     class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <!-- Legenda sempre legível na base (leve gradiente), reforça no hover -->
                <div class="absolute inset-x-0 bottom-0 p-3 bg-gradient-to-t from-noturno/85 via-noturno/30 to-transparent">
                    <span class="block text-pergaminho text-xs font-medium leading-tight line-clamp-2">{{ foto.legenda|default:foto.get_categoria_display }}</span>
                </div>
                <!-- Dica de clique (aparece no hover) -->
                <span class="absolute top-2 right-2 w-8 h-8 rounded-full bg-noturno/50 backdrop-blur-sm text-pergaminho flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300" aria-hidden="true">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h6v6M14 10l7-7M9 21H3v-6M10 14l-7 7"/></svg>
                </span>
                {% else %}
                <!-- Placeholder de marca quando falta a imagem (nada de texto solto) -->
                <div class="w-full h-full flex flex-col items-center justify-center gap-2 bg-gradient-to-br from-noturno to-madeira p-3 text-center">
                    <svg class="w-7 h-7 text-lampiao/50" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    <span class="text-pergaminho/50 text-[11px] leading-tight line-clamp-2">{{ foto.legenda|default:foto.get_categoria_display }}</span>
                </div>
                {% endif %}
            </button>
            {% endfor %}
        </div>
    </div>

    <!-- LIGHTBOX / CARROSSEL (foto grande + cartão + Instagram) -->
    <div id="galeria-lightbox" class="fixed inset-0 z-[100] hidden items-center justify-center bg-noturno/90 backdrop-blur-sm p-4 sm:p-8"
         data-instagram="{{ config.instagram_url|default:'https://www.instagram.com/pousadavotesta' }}"
         aria-modal="true" role="dialog" aria-label="Galeria de fotos">

        <!-- Fechar -->
        <button type="button" data-gl-close aria-label="Fechar"
                class="absolute top-4 right-4 sm:top-6 sm:right-6 w-11 h-11 rounded-full bg-pergaminho/10 hover:bg-pergaminho/20 text-pergaminho flex items-center justify-center transition-colors z-10">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

        <div class="w-full max-w-5xl mx-auto">
            <!-- Desktop: foto + cartão sobreposto -->
            <div class="hidden md:flex relative items-center">
                <div class="w-[440px] h-[440px] rounded-3xl overflow-hidden bg-noturno flex-shrink-0 shadow-2xl">
                    <img data-gl-img class="w-full h-full object-cover transition-opacity duration-300" alt="" draggable="false">
                </div>
                <div class="bg-pergaminho rounded-3xl shadow-2xl p-8 ml-[-80px] z-10 max-w-xl flex-1 transition-opacity duration-300" data-gl-card>
                    <p data-gl-categoria class="text-madeira text-xs font-medium uppercase tracking-[0.2em] mb-2"></p>
                    <h3 data-gl-legenda class="font-display text-2xl font-black text-noturno mb-6 leading-snug"></h3>
                    <a data-gl-insta href="#" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-2 bg-lampiao text-noturno font-bold text-sm px-5 py-3 rounded-full hover:bg-lampiao/90 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
                        Ver no Instagram
                    </a>
                </div>
            </div>

            <!-- Mobile: empilhado -->
            <div class="md:hidden max-w-sm mx-auto text-center">
                <div class="w-full aspect-square bg-noturno rounded-3xl overflow-hidden mb-5 shadow-2xl">
                    <img data-gl-img-m class="w-full h-full object-cover transition-opacity duration-300" alt="" draggable="false">
                </div>
                <div data-gl-card-m class="transition-opacity duration-300">
                    <p data-gl-categoria-m class="text-lampiao text-xs font-medium uppercase tracking-[0.2em] mb-1"></p>
                    <h3 data-gl-legenda-m class="font-display text-xl font-black text-pergaminho mb-5 leading-snug"></h3>
                    <a data-gl-insta-m href="#" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-2 bg-lampiao text-noturno font-bold text-sm px-5 py-3 rounded-full hover:bg-lampiao/90 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
                        Ver no Instagram
                    </a>
                </div>
            </div>

            <!-- Navegação -->
            <div class="flex justify-center items-center gap-6 mt-8">
                <button type="button" data-gl-prev aria-label="Foto anterior"
                        class="w-12 h-12 rounded-full bg-pergaminho/10 hover:bg-pergaminho/20 text-pergaminho flex items-center justify-center transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div data-gl-dots class="flex gap-2"></div>
                <button type="button" data-gl-next aria-label="Próxima foto"
                        class="w-12 h-12 rounded-full bg-pergaminho/10 hover:bg-pergaminho/20 text-pergaminho flex items-center justify-center transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </div>
    </div>
</section>
