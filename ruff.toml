# Configuração do Ruff (lint) — CRM Vô Testa.
# Rodar: .venv/bin/ruff check apps/ config/
#        .venv/bin/ruff check apps/ config/ --fix   (corrige o que for seguro)

target-version = "py314"
line-length = 100

# Não lintar código gerado / ambiente.
extend-exclude = [
    "**/migrations/**",
    ".venv",
    "staticfiles",
]

[lint]
# Conjunto padrão (pyflakes + erros do pycodestyle) + ordenação de imports (I)
# e modernizações seguras (UP). Mantém a base verde sem exigir refactors amplos.
# Subconjunto de alto sinal do flake8-bandit (S): segredos hard-coded, SQLi por
# string, hash fraco, pickle, verify=False, shell=True. (Scan completo = bandit no CI.)
select = ["E4", "E7", "E9", "F", "I", "UP",
          "S105", "S106", "S107", "S608", "S301", "S302", "S324", "S501", "S602", "S605", "S611"]

[lint.per-file-ignores]
# Testes e seeds podem ter linhas longas e imports locais por conveniência.
# Senhas em testes/seed são fixtures, não segredos reais (S105/106/107).
"**/tests.py" = ["E501", "S105", "S106", "S107"]
"**/tests_e2e.py" = ["E501", "S105", "S106", "S107"]
"**/management/commands/*.py" = ["E501", "S105", "S106", "S107"]
