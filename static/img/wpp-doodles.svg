<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Padrão de doodles ORIGINAL (não é o do WhatsApp) — denso, ícones pequenos,
       misturando a marca Vô Testa (inventor: engrenagem, roda d'água, cartola, lâmpada,
       óculos+bigode do logo, vinho) com hospedagem/lago. Tom tan sobre o bege. Tileável. -->
  <g fill="none" stroke="#c5baa6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <!-- ── linha 1 ── -->
    <!-- engrenagem -->
    <g transform="translate(26,26)"><circle r="4"/><circle r="1.6"/><path d="M0 -6v-1.6M0 6v1.6M-6 0h-1.6M6 0h1.6M-4.2 -4.2l-1.1 -1.1M4.2 4.2l1.1 1.1M4.2 -4.2l1.1 -1.1M-4.2 4.2l-1.1 1.1"/></g>
    <!-- cartola -->
    <g transform="translate(78,24)"><path d="M-8 5h16"/><path d="M-5 5v-9h10v9"/><path d="M-5 0h10"/></g>
    <!-- sol -->
    <g transform="translate(130,26)"><circle r="3.5"/><path d="M0 -6v-2M0 6v2M-6 0h-2M6 0h2M-4.2 -4.2l-1.4 -1.4M4.2 4.2l1.4 1.4M4.2 -4.2l1.4 -1.4M-4.2 4.2l-1.4 1.4"/></g>
    <!-- óculos + bigode (logo) -->
    <g transform="translate(184,26)"><circle cx="-4.5" cy="-2" r="3"/><circle cx="4.5" cy="-2" r="3"/><path d="M-1.5 -2h3M-6 3c1.5 2.2 4.5 2.2 6 0 1.5 2.2 4.5 2.2 6 0" transform="translate(-3,0)"/></g>
    <!-- taça de vinho -->
    <g transform="translate(240,25)"><path d="M-4.5 -7h9a4.5 5 0 0 1 -9 0zM0 -2v7M-3.5 5h7"/></g>
    <!-- chave -->
    <g transform="translate(288,28)"><circle cx="-4" cy="0" r="3.5"/><path d="M-0.5 0h8M5 0v2.5M8 0v3.5"/></g>

    <!-- ── linha 2 ── -->
    <!-- roda d'água -->
    <g transform="translate(52,76)"><circle r="7"/><circle r="1.6"/><path d="M0 -7v14M-7 0h14M-5 -5l10 10M5 -5l-10 10"/><path d="M0 -7v-2M0 7v2M7 0h2M-7 0h-2"/></g>
    <!-- café -->
    <g transform="translate(106,74)"><rect x="-5" y="-3.5" width="10" height="8" rx="2"/><path d="M5 -1.5h2.5a2 2 0 0 1 0 4h-2.5M-2 -6c1 1 -1 1.5 0 2.5M2 -6c1 1 -1 1.5 0 2.5"/></g>
    <!-- onda -->
    <g transform="translate(158,78)"><path d="M-8 0c2 -3.5 4 -3.5 6 0s4 3.5 6 0M-8 5c2 -3.5 4 -3.5 6 0s4 3.5 6 0"/></g>
    <!-- lâmpada (invenção) -->
    <g transform="translate(210,76)"><circle cx="0" cy="-2" r="4.5"/><path d="M-2 3h4M-2 5h4M-1.5 7h3"/></g>
    <!-- estrela -->
    <g transform="translate(262,76)"><path d="M0 -5l1.5 3 3.3.5 -2.4 2.3.6 3.3L0 5.2l-3 1.6.6 -3.3 -2.4 -2.3 3.3 -.5z"/></g>

    <!-- ── linha 3 ── -->
    <!-- garrafa de vinho -->
    <g transform="translate(26,126)"><path d="M-2.5 6v-8l-1 -2v-3h3v3l-1 2v8z"/><path d="M-2.5 -2h3"/></g>
    <!-- mala -->
    <g transform="translate(80,126)"><rect x="-6" y="-4.5" width="12" height="10" rx="2"/><path d="M-3 -4.5v-2.5h6v2.5M0 -4.5v10"/></g>
    <!-- peixe -->
    <g transform="translate(134,126)"><path d="M-7 0c3 -3.5 8 -3.5 11 0 -3 3.5 -8 3.5 -11 0zM4 0l5 -3v6z"/></g>
    <!-- coração -->
    <g transform="translate(186,126)"><path d="M0 5c-6 -4 -8 -7.5 -4.6 -10 2 -1.5 4 -.6 4.6 .7 .6 -1.3 2.6 -2.2 4.6 -.7 3.4 2.5 1.4 6 -4.6 10z"/></g>
    <!-- câmera -->
    <g transform="translate(240,126)"><rect x="-7" y="-4.5" width="14" height="10" rx="2"/><circle r="2.8"/><path d="M-4 -4.5l1.5 -2.5h5l1.5 2.5"/></g>
    <!-- nuvem -->
    <g transform="translate(290,128)"><path d="M-7 3a3.5 3.5 0 0 1 1 -7 4.5 4.5 0 0 1 8 -1 2.7 2.7 0 0 1 1.8 8z"/></g>

    <!-- ── linha 4 ── -->
    <!-- pin -->
    <g transform="translate(52,176)"><path d="M0 7c4 -5 5 -7.5 5 -10.5a5 5 0 0 0 -10 0c0 3 1 5.5 5 10.5z"/><circle cy="-4" r="1.8"/></g>
    <!-- barco -->
    <g transform="translate(106,178)"><path d="M-7 4h14l-2 4h-10zM0 3v-10l6 8z"/></g>
    <!-- guarda-sol -->
    <g transform="translate(158,176)"><path d="M0 7v-9M-8 -2a8 5.5 0 0 1 16 0c-2.7 -1.8 -2.7 -1.8 -5.3 0 -2.7 -1.8 -2.7 -1.8 -5.4 0z"/></g>
    <!-- smiley -->
    <g transform="translate(210,176)"><circle r="6"/><circle cx="-2.2" cy="-1.5" r=".8"/><circle cx="2.2" cy="-1.5" r=".8"/><path d="M-2.6 1.6c1.3 1.6 3.9 1.6 5.2 0"/></g>
    <!-- nota musical -->
    <g transform="translate(262,178)"><path d="M-3 5a2.2 2.2 0 1 0 0 -.1M-3 5v-10l7 -1.8v9"/><path d="M4 3.2a2.2 2.2 0 1 0 0 -.1"/></g>

    <!-- ── linha 5 ── -->
    <!-- folha/palma -->
    <g transform="translate(26,226)"><path d="M0 7c0 -7 -4.5 -10.5 -8 -11.5 2.6 5 5.4 7 8 11.5zM0 7c0 -7 4.5 -10.5 8 -11.5 -2.6 5 -5.4 7 -8 11.5z"/></g>
    <!-- montanha -->
    <g transform="translate(80,228)"><path d="M-8 5l4.5 -8 2.7 3.6 2.7 -5.4 6.1 9.8z"/></g>
    <!-- cama -->
    <g transform="translate(134,226)"><path d="M-7 4v-6M-7 0h14v4M7 -2a3 3 0 0 0 -3 -3h-4v3M-7 4v3M7 4v3"/></g>
    <!-- estrela -->
    <g transform="translate(186,226)"><path d="M0 -5l1.5 3 3.3.5 -2.4 2.3.6 3.3L0 5.2l-3 1.6.6 -3.3 -2.4 -2.3 3.3 -.5z"/></g>
    <!-- lua -->
    <g transform="translate(240,226)"><path d="M3 -6a6.5 6.5 0 1 0 0 12 7.5 7.5 0 0 1 0 -12z"/></g>
    <!-- drink -->
    <g transform="translate(290,228)"><path d="M-4.5 -5h9l-4.5 5.5zM0 .5v5.5M-3.5 6h7M2 -5l3 -3"/></g>

    <!-- ── linha 6 (offset) ── -->
    <!-- engrenagem -->
    <g transform="translate(52,278)"><circle r="4"/><circle r="1.6"/><path d="M0 -6v-1.6M0 6v1.6M-6 0h-1.6M6 0h1.6M-4.2 -4.2l-1.1 -1.1M4.2 4.2l1.1 1.1M4.2 -4.2l1.1 -1.1M-4.2 4.2l-1.1 1.1"/></g>
    <!-- taça -->
    <g transform="translate(106,278)"><path d="M-4.5 -7h9a4.5 5 0 0 1 -9 0zM0 -2v7M-3.5 5h7"/></g>
    <!-- chave -->
    <g transform="translate(158,278)"><circle cx="-4" cy="0" r="3.5"/><path d="M-0.5 0h8M5 0v2.5M8 0v3.5"/></g>
    <!-- cartola -->
    <g transform="translate(210,278)"><path d="M-8 5h16"/><path d="M-5 5v-9h10v9"/><path d="M-5 0h10"/></g>
    <!-- sol -->
    <g transform="translate(262,278)"><circle r="3.5"/><path d="M0 -6v-2M0 6v2M-6 0h-2M6 0h2M-4.2 -4.2l-1.4 -1.4M4.2 4.2l1.4 1.4M4.2 -4.2l1.4 -1.4M-4.2 4.2l-1.4 1.4"/></g>
  </g>
</svg>
